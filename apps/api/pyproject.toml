[project]
name = "clarion-api"
version = "0.1.0"
description = "Clarion API and worker: claim intake, source matching, review, localisation and broadcast."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.165.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.3",
  "sqlalchemy[asyncio]>=2.1.9",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
  "pgvector>=0.5.1",
  "taskiq>=0.13.0",
  "taskiq-redis>=1.2.4",
  "redis>=8.1.0",
  "google-genai>=3.6.1",
  "httpx>=0.28.1",
  "structlog>=26.1.0",
  "qrcode>=8.2",
  "pillow>=13.0.0",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
  "ruff>=0.17.5",
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clarion_api"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
  "ASYNC", "S", "T20", "PT", "RUF", "TID", "TC", "ERA", "PL", "DTZ", "FAST",
]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S106"]
"migrations/**" = ["ERA001"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Vendor SDKs may only be imported inside their adapter module.
"google.genai".msg = "Import the LLM vendor SDK only in clarion_api.adapters.llm.gemini."

[tool.ruff.lint.isort]
known-first-party = ["clarion_api"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["clarion_api"]

[[tool.mypy.overrides]]
module = ["qrcode.*", "pgvector.*", "taskiq_redis.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --cov=clarion_api --cov-report=term-missing:skip-covered"
markers = ["integration: needs Postgres and Redis (set RUN_INTEGRATION=1)"]
filterwarnings = ["error::DeprecationWarning:clarion_api.*"]

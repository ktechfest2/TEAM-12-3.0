# Self hosted Clarion. Run through infra/deploy/clarion.sh, which generates the secrets and
# passes --env-file. Only the web container publishes a port, on loopback; the host Caddy
# proxies the hostname to it. See docs/deploy/.
name: clarion

x-api-env: &api-env
  APP_ENV: production
  APP_BASE_URL: https://${DOMAIN:?set DOMAIN in deploy.env}
  PUBLIC_WEB_URL: https://${DOMAIN}
  LOG_FORMAT: json
  DATABASE_URL: postgresql+asyncpg://clarion:${POSTGRES_PASSWORD:?generated by clarion.sh}@postgres:5432/clarion
  REDIS_URL: redis://redis:6379/0
  REPOSITORY_BACKEND: sql
  STORAGE_PROVIDER: local
  STORAGE_LOCAL_DIR: /data/media
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?generated by clarion.sh}
  AUTH_REVIEWER_INVITE_CODE: ${AUTH_REVIEWER_INVITE_CODE:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
  LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-20}
  LLM_USD_PER_MILLION_TOKENS: ${LLM_USD_PER_MILLION_TOKENS:-1}
  SPEECH_PROVIDER: ${SPEECH_PROVIDER:-fake}
  SPEECH_API_KEY: ${SPEECH_API_KEY:-}
  SPEECH_VOICES: ${SPEECH_VOICES:-}
  CHANNEL_TELEGRAM_BOT_TOKEN: ${CHANNEL_TELEGRAM_BOT_TOKEN:-}
  CHANNEL_TELEGRAM_CHAT_ID: ${CHANNEL_TELEGRAM_CHAT_ID:-}
  CHANNEL_TELEGRAM_WEBHOOK_SECRET: ${CHANNEL_TELEGRAM_WEBHOOK_SECRET:-}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: clarion
      POSTGRES_DB: clarion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clarion -d clarion"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Holds the job queue and the monthly spend counter, so it keeps an append only file.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m

  api:
    image: clarion-api:local
    build:
      context: ../../apps/api
    restart: unless-stopped
    environment: *api-env
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn clarion_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    volumes:
      - media:/data/media
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m

  worker:
    image: clarion-api:local
    restart: unless-stopped
    environment: *api-env
    command: ["taskiq", "worker", "clarion_api.worker.broker:broker", "clarion_api.worker.tasks"]
    volumes:
      - media:/data/media
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 384m

  web:
    image: clarion-web:local
    build:
      context: ../..
      dockerfile: infra/deploy/web.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - media:/srv/media:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 48m

volumes:
  pgdata:
  redisdata:
  media:

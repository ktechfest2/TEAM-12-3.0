# Web container: serves the built app, sends /api/ to the API (prefix removed) and serves media.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s;   # Docker DNS, so a restarted API is found again
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # The delivery board reads a server sent event stream: never buffer or time it out early.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
